
/**
 * 统一的签名配置脚本
 * 适配 internal/official flavor 目录结构，从 app/src/<flavor>/sign.properties 读取签名。
 */

def applyFlavorSigning = { signingConfig, String flavorName, String fallbackKeystore, String fallbackPassword, String fallbackAlias ->
    def propsFile = file("${project.projectDir}/src/${flavorName}/sign.properties")
    if (propsFile.exists()) {
        def props = new Properties()
        propsFile.withInputStream { props.load(it) }

        def storePath = props.getProperty('keystore') ?: fallbackKeystore
        signingConfig.storeFile = file("${project.projectDir}/src/${flavorName}/${storePath}")
        signingConfig.storePassword = props.getProperty('keystore.password') ?: fallbackPassword
        signingConfig.keyAlias = props.getProperty('keyAlias') ?: fallbackAlias
        signingConfig.keyPassword = props.getProperty('keyPassword') ?: fallbackPassword
        println("🔑 [Sign] Applied ${flavorName} signing config from ${propsFile}")
    } else {
        signingConfig.storeFile = file("${project.projectDir}/src/${flavorName}/${fallbackKeystore}")
        signingConfig.storePassword = fallbackPassword
        signingConfig.keyAlias = fallbackAlias
        signingConfig.keyPassword = fallbackPassword
        println("⚠️ [Sign] Using ${flavorName} fallback signing config")
    }
}

ext.setupSigningConfigs = { android ->
    android.signingConfigs {
        internal {
            applyFlavorSigning(delegate, "internal", "pdfreader.jks", "pdfreader", "pdfreader")
        }
        official {
            applyFlavorSigning(delegate, "official", "release.jks", "release", "release")
        }
    }

    android.productFlavors {
        internal {
            signingConfig = android.signingConfigs.internal
        }
        official {
            signingConfig = android.signingConfigs.official
        }
    }
}
