
/**
 * 统一的签名配置脚本 (Layer 2)
 * 适配零变体架构，根据动态属性应用签名。
 */

ext.setupSigningConfigs = { android ->
    android.signingConfigs {
        // 1. 内部测试签名配置 (默认)
        internal {
            def internalPropsFile = file("${project.rootDir}/scripts/sign.properties")
            if (internalPropsFile.exists()) {
                def props = new Properties()
                internalPropsFile.withInputStream { props.load(it) }

                storeFile = file("${project.rootDir}/scripts/" + props.getProperty('keystore'))
                storePassword = props.getProperty('keystore.password')
                keyAlias = props.getProperty('keyAlias')
                keyPassword = props.getProperty('keyPassword')
                println("🔑 [Sign] Applied signing config from scripts/sign.properties")
            } else {
                // 离线 Fallback: 尝试使用旧路径或应用默认签名
                storeFile = file("${project.projectDir}/src/internal/pdfreader.jks")
                storePassword = "pdfreader"
                keyAlias = "pdfreader"
                keyPassword = "pdfreader"
                println("⚠️ [Sign] Using Fallback signing config")
            }
        }
    }

    // 2. 根据构建模式动态应用签名
    android.buildTypes {
        release {
            // 在零变体架构下，Release 默认使用 internal 签名，
            // 除非 CI 注入了 official 的 sign.properties 覆盖了 scripts/ 下的文件
            signingConfig = android.signingConfigs.internal
        }
        debug {
//            signingConfig = android.signingConfigs.internal
        }
    }
}