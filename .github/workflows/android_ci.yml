name: Build official signed AAB

on:
  workflow_dispatch:

jobs:
  build-official-aab:
    runs-on: ubuntu-latest

    env:
      # 给 release/R8 阶段更多堆内存，避免 GitHub Runner 上 4G OOM
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx7g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError"
      GRADLE_JVM_ARGS: "-Xmx7g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8"
      KOTLIN_DAEMON_JVM_ARGS: "-Xmx1024m"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant Gradle wrapper permission
        run: chmod +x ./gradlew

      - name: Configure release secrets
        env:
          LCB_2_SECRETS: ${{ secrets.LCB_2_SECRETS }}
        run: |
          set -euo pipefail

          if [ -z "$LCB_2_SECRETS" ]; then
            echo "Missing LCB_2_SECRETS."
            exit 1
          fi

          REMAX_SDK_TOKEN=$(jq -r '.remax_sdk_token // empty' <<< "$LCB_2_SECRETS")
          PLAYSTORE_KEYSTORE_BASE64=$(jq -r '.playstore_keystore_base64 // empty' <<< "$LCB_2_SECRETS")
          PLAYSTORE_STORE_PASSWORD=$(jq -r '.playstore_store_password // empty' <<< "$LCB_2_SECRETS")
          PLAYSTORE_KEY_ALIAS=$(jq -r '.playstore_key_alias // empty' <<< "$LCB_2_SECRETS")
          PLAYSTORE_KEY_PASSWORD=$(jq -r '.playstore_key_password // empty' <<< "$LCB_2_SECRETS")

          for required_key in REMAX_SDK_TOKEN PLAYSTORE_KEYSTORE_BASE64 PLAYSTORE_STORE_PASSWORD PLAYSTORE_KEY_ALIAS PLAYSTORE_KEY_PASSWORD; do
            if [ -z "${!required_key}" ]; then
              echo "Missing $required_key in LCB_2_SECRETS."
              exit 1
            fi
          done

          echo "REMAX_SDK_TOKEN=$REMAX_SDK_TOKEN" >> "$GITHUB_ENV"

          mkdir -p app/src/official
          echo "$PLAYSTORE_KEYSTORE_BASE64" | base64 -di > app/src/official/release.jks

          {
            echo "keystore=release.jks"
            echo "keystore.password=$PLAYSTORE_STORE_PASSWORD"
            echo "keyAlias=$PLAYSTORE_KEY_ALIAS"
            echo "keyPassword=$PLAYSTORE_KEY_PASSWORD"
          } > app/src/official/sign.properties

          GOOGLE_JSON_PATH="app/src/official/google-services.json"
          if [ ! -f "$GOOGLE_JSON_PATH" ]; then
            echo "Missing Google Services JSON: $GOOGLE_JSON_PATH"
            exit 1
          fi

      - name: Configure CI Gradle properties
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle"
          {
            echo "android.enableR8.fullMode=false"
            echo "org.gradle.daemon.performance.disable-logging=true"
          } >> "$HOME/.gradle/gradle.properties"

      - name: Resolve version info
        id: version_info
        run: |
          set -euo pipefail
          COMMON_GRADLE_ARGS=(
            "-Dorg.gradle.jvmargs=${GRADLE_JVM_ARGS}"
            "-Dkotlin.daemon.jvmargs=${KOTLIN_DAEMON_JVM_ARGS}"
            --max-workers=1
            --no-parallel
            --build-cache
          )

          VERSION_NAME="$(./gradlew -q :app:printOfficialReleaseVersionName --console=plain "${COMMON_GRADLE_ARGS[@]}" | awk 'NF{line=$0} END{print line}')"
          AAB_NAME="$(./gradlew -q :app:printOfficialReleaseAabName --console=plain "${COMMON_GRADLE_ARGS[@]}" | awk 'NF{line=$0} END{print line}')"

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "aab_name=$AAB_NAME" >> "$GITHUB_OUTPUT"

      - name: Build officialRelease AAB
        run: |
          set -euo pipefail
          COMMON_GRADLE_ARGS=(
            "-Dorg.gradle.jvmargs=${GRADLE_JVM_ARGS}"
            "-Dkotlin.daemon.jvmargs=${KOTLIN_DAEMON_JVM_ARGS}"
            --max-workers=1
            --no-parallel
            --build-cache
          )
          BUILD_ARGS=(
            -Pandroid.release.optimizeEnabled=false
          )

          ./gradlew :app:bundleOfficialRelease \
            -x lint \
            -x :app:lintOfficialRelease \
            -x :app:lintVitalOfficialRelease \
            -x :app:lintVitalAnalyzeOfficialRelease \
            -x :app:lintVitalReportOfficialRelease \
            "${BUILD_ARGS[@]}" \
            "${COMMON_GRADLE_ARGS[@]}" \
            --no-daemon \
            --stacktrace

      - name: Rename AAB output
        id: rename_aab
        run: |
          set -euo pipefail

          AAB_DIR="app/build/outputs/bundle/officialRelease"
          TARGET_AAB="$AAB_DIR/${{ steps.version_info.outputs.aab_name }}"
          SOURCE_AAB="$(find "$AAB_DIR" -maxdepth 1 -type f -name '*.aab' | head -n 1)"

          if [ -z "$SOURCE_AAB" ]; then
            echo "No AAB file found in $AAB_DIR" >&2
            exit 1
          fi

          if [ "$SOURCE_AAB" != "$TARGET_AAB" ]; then
            rm -f "$TARGET_AAB"
            mv "$SOURCE_AAB" "$TARGET_AAB"
          fi

          echo "target_aab=$TARGET_AAB" >> "$GITHUB_OUTPUT"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version_info.outputs.aab_name }}
          path: ${{ steps.rename_aab.outputs.target_aab }}
          if-no-files-found: error
          retention-days: 30
