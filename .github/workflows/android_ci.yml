name: Android Release Build

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build Variant (e.g., internalRelease, playstoreRelease)'
        required: true
        default: 'internalRelease'
        type: choice
        options:
        - internalRelease
        - playstoreRelease
  pull_request:
    branches: [ "master", "main", "develop" ]
  push:
    tags: 
      - "v*" 
      - "T*"

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    env:
      BUILD_VARIANT: ${{ github.event.inputs.variant || 'internalRelease' }}
      # Override default 8GB heap to 4GB to fit in GitHub Actions runner limits (7GB total)
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError"

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Internal Keystore & Google Services
      if: contains(env.BUILD_VARIANT, 'internal')
      env:
        ENCODED_STRING: ${{ secrets.INTERNAL_KEYSTORE_BASE64 }}
        GOOGLE_JSON_ENCODED: ${{ secrets.INTERNAL_GOOGLE_SERVICES_JSON_BASE64 }}
      run: |
        echo "Checking Secrets for Internal..."
        if [ -z "$ENCODED_STRING" ]; then
          echo "Warning: INTERNAL_KEYSTORE_BASE64 is empty."
        else
          mkdir -p app/src/internal
          echo "$ENCODED_STRING" | base64 -di > app/src/internal/pdfreader.jks
          echo "Decoded Internal Keystore"
        fi
        
        if [ -z "$GOOGLE_JSON_ENCODED" ]; then
          echo "Warning: INTERNAL_GOOGLE_SERVICES_JSON_BASE64 is empty."
        else
          mkdir -p app/src/internal
          echo "$GOOGLE_JSON_ENCODED" | base64 -di > app/src/internal/google-services.json
          echo "Decoded Internal google-services.json to app/src/internal/"
        fi

    - name: Create Internal Sign Properties
      if: contains(env.BUILD_VARIANT, 'internal')
      env:
        STORE_PASSWORD: ${{ secrets.INTERNAL_STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.INTERNAL_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.INTERNAL_KEY_PASSWORD }}
      run: |
        if [ ! -z "$STORE_PASSWORD" ]; then
          mkdir -p app/src/internal
          echo "keystore=pdfreader.jks" > app/src/internal/sign.properties
          echo "keystore.password=$STORE_PASSWORD" >> app/src/internal/sign.properties
          echo "keyAlias=$KEY_ALIAS" >> app/src/internal/sign.properties
          echo "keyPassword=$KEY_PASSWORD" >> app/src/internal/sign.properties
        fi

    - name: Decode PlayStore Keystore & Google Services
      if: contains(env.BUILD_VARIANT, 'playstore')
      env:
        ENCODED_STRING: ${{ secrets.PLAYSTORE_KEYSTORE_BASE64 }}
        GOOGLE_JSON_ENCODED: ${{ secrets.PLAYSTORE_GOOGLE_SERVICES_JSON_BASE64 }}
      run: |
        echo "Checking Secrets for PlayStore..."
        if [ -z "$ENCODED_STRING" ]; then
          echo "Error: PLAYSTORE_KEYSTORE_BASE64 is empty!"
          exit 1
        fi
        
        mkdir -p app/src/playstore
        echo "$ENCODED_STRING" | base64 -di > app/src/playstore/release.jks
        echo "Decoded PlayStore Keystore"

        if [ -n "$GOOGLE_JSON_ENCODED" ]; then
           mkdir -p app/src/playstore
           echo "$GOOGLE_JSON_ENCODED" | base64 -di > app/src/playstore/google-services.json
           echo "Decoded PlayStore google-services.json to app/src/playstore/"
        fi

    - name: Create PlayStore Sign Properties
      if: contains(env.BUILD_VARIANT, 'playstore')
      env:
        STORE_PASSWORD: ${{ secrets.PLAYSTORE_STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.PLAYSTORE_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.PLAYSTORE_KEY_PASSWORD }}
      run: |
        if [ ! -z "$STORE_PASSWORD" ]; then
          mkdir -p app/src/playstore
          echo "keystore=release.jks" > app/src/playstore/sign.properties
          echo "keystore.password=$STORE_PASSWORD" >> app/src/playstore/sign.properties
          echo "keyAlias=$KEY_ALIAS" >> app/src/playstore/sign.properties
          echo "keyPassword=$KEY_PASSWORD" >> app/src/playstore/sign.properties
        fi

    - name: Build with Gradle
      run: |
        echo "Building Variant: $BUILD_VARIANT"
        
        # Capitalize variant name for task construction (e.g. playstoreRelease -> PlaystoreRelease)
        CAP_VARIANT="$(tr '[:lower:]' '[:upper:]' <<< ${BUILD_VARIANT:0:1})${BUILD_VARIANT:1}"
        
        # Only exclude lintVital for Release builds (Debug builds don't have this task, causing failure)
        EXCLUDE_LINT_VITAL=""
        if [[ "$BUILD_VARIANT" == *"Release"* ]]; then
             EXCLUDE_LINT_VITAL="-x lintVital$CAP_VARIANT"
        fi
        
        # Extract Tag Name (if triggered by tag)
        INTERNAL_VERSION_PARAM=""
        if [[ $GITHUB_REF == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            echo "Triggered by Tag: $TAG_NAME"
            INTERNAL_VERSION_PARAM="-PinternalVersionName=$TAG_NAME"
        fi

        if [[ "$BUILD_VARIANT" == *"playstore"* ]]; then
            echo "Building App Bundle (AAB) for $BUILD_VARIANT"
            ./gradlew bundle$BUILD_VARIANT -x lint $EXCLUDE_LINT_VITAL --stacktrace
        else
            echo "Building APK for $BUILD_VARIANT"
            # Pass the tag version to Gradle
            ./gradlew assemble$BUILD_VARIANT -x lint $EXCLUDE_LINT_VITAL $INTERNAL_VERSION_PARAM --stacktrace
        fi

    - name: Generate Changelog for Internal Release
      if: startsWith(github.ref, 'refs/tags/T')
      run: |
        echo "Generating Changelog..."
        # Fetch all tags to find previous one
        git fetch --prune --unshallow --tags
        
        CURRENT_TAG=${GITHUB_REF#refs/tags/}
        # Find previous tag (sort by creator date desc, skip current, take first)
        # 修复逻辑: 不再只 grep "T"，而是查找任何版本 Tag (T* 或 v*)。
        # 这样如果上一个是 v1.0.1，也能正确计算增量
        PREV_TAG=$(git tag --sort=-creatordate | grep -E "^(T|v)" | grep -v "^${CURRENT_TAG}$" | head -n 1)
        
        if [ -z "$PREV_TAG" ]; then
           echo "No previous tag found. Using initial commit logic or empty."
           # Fallback: just list commits from the beginning if needed, or specific base
           # For now, let's just use HEAD~10 for safety if no tag, or handle error
           PREV_TAG=$(git rev-list --max-parents=0 HEAD) 
        fi
        
        echo "Diff: $PREV_TAG..$CURRENT_TAG"
        
        python3 scripts/generate_changelog.py "$PREV_TAG" "$CURRENT_TAG"
        
        cat release_notes.txt

    - name: Upload Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-${{ env.BUILD_VARIANT }}
        path: |
          app/build/outputs/apk/**/*.apk
          app/build/outputs/bundle/**/*.aab
          release_notes.txt
