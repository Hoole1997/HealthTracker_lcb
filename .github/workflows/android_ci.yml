name: Android Release Build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Optional versionName override'
        required: false
        type: string

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: main-repo

    env:
      # 给 release/R8 阶段更多堆内存，避免 GitHub Runner 上 4G OOM
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx7g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError"

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        path: main-repo

    - name: Set up project version fallback
      run: |
        # 从 build.gradle.kts 提取版本号
        V_NAME=$(grep "defaultVersionName =" app/build.gradle.kts | head -n 1 | awk -F'"' '{print $2}')
        echo "PROJECT_VERSION=$V_NAME" >> $GITHUB_ENV
        echo "Extracted project version: $V_NAME"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        # cache: gradle # Remove basic cache, use setup-gradle below

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: false # Allow writing to cache for all branches

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Official AAB
      env:
        LCB_3_SECRETS: ${{ secrets.LCB_3_SECRETS }}
      run: |
        echo "Building official release AAB"
        if [ -z "$LCB_3_SECRETS" ]; then
            echo "Missing LCB_3_SECRETS."
            exit 1
        fi

        REMAX_SDK_TOKEN=$(jq -r '.remax_sdk_token // empty' <<< "$LCB_3_SECRETS")
        PLAYSTORE_KEYSTORE_BASE64=$(jq -r '.playstore_keystore_base64 // empty' <<< "$LCB_3_SECRETS")
        PLAYSTORE_STORE_PASSWORD=$(jq -r '.playstore_store_password // empty' <<< "$LCB_3_SECRETS")
        PLAYSTORE_KEY_ALIAS=$(jq -r '.playstore_key_alias // empty' <<< "$LCB_3_SECRETS")
        PLAYSTORE_KEY_PASSWORD=$(jq -r '.playstore_key_password // empty' <<< "$LCB_3_SECRETS")

        for required_key in REMAX_SDK_TOKEN PLAYSTORE_STORE_PASSWORD PLAYSTORE_KEY_ALIAS PLAYSTORE_KEY_PASSWORD; do
            if [ -z "${!required_key}" ]; then
                echo "Missing $required_key in LCB_3_SECRETS."
                exit 1
            fi
        done

        export REMAX_SDK_TOKEN
        
        # 1. 签名准备。Google Services JSON 已提交在 app/src/official/ 变体目录。
        KEYSTORE_FILE="lcb3-release.jks"
        if [ -n "$PLAYSTORE_KEYSTORE_BASE64" ]; then
            echo "$PLAYSTORE_KEYSTORE_BASE64" | base64 -di > "scripts/$KEYSTORE_FILE"
            echo "KEYSTORE_GENERATED=false" >> "$GITHUB_ENV"
        else
            echo "playstore_keystore_base64 is empty. Generating scripts/$KEYSTORE_FILE for this CI run."
            keytool -genkeypair \
                -v \
                -keystore "scripts/$KEYSTORE_FILE" \
                -storepass "$PLAYSTORE_STORE_PASSWORD" \
                -alias "$PLAYSTORE_KEY_ALIAS" \
                -keypass "$PLAYSTORE_KEY_PASSWORD" \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=HealthTracker LCB3, OU=CI, O=HealthTracker, L=Unknown, ST=Unknown, C=US"
            echo "KEYSTORE_GENERATED=true" >> "$GITHUB_ENV"
            echo "GENERATED_KEYSTORE_PATH=main-repo/scripts/$KEYSTORE_FILE" >> "$GITHUB_ENV"
        fi

        GOOGLE_JSON_PATH="app/src/official/google-services.json"

        if [ ! -f "$GOOGLE_JSON_PATH" ]; then
            echo "Missing Google Services JSON: $GOOGLE_JSON_PATH"
            exit 1
        fi

        # 2. 生成签名配置文件 (sign.properties)
        echo "keystore=$KEYSTORE_FILE" > scripts/sign.properties
        echo "keystore.password=$PLAYSTORE_STORE_PASSWORD" >> scripts/sign.properties
        echo "keyAlias=$PLAYSTORE_KEY_ALIAS" >> scripts/sign.properties
        echo "keyPassword=$PLAYSTORE_KEY_PASSWORD" >> scripts/sign.properties

        # 3. 提取标签版本 (如果由标签触发)
        if [[ $GITHUB_REF == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            echo "Triggered by Tag: $TAG_NAME"
            echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
            VERSION_PARAM="-PinternalVersionName=$TAG_NAME"
            echo "VERSION_PARAM=$VERSION_PARAM" >> $GITHUB_ENV
        elif [ -n "${{ github.event.inputs.version_name }}" ]; then
            VERSION_PARAM="-PinternalVersionName=${{ github.event.inputs.version_name }}"
            echo "VERSION_PARAM=$VERSION_PARAM" >> $GITHUB_ENV
        fi

        # 4. 执行 official AAB 构建任务
        ./gradlew bundleOfficialRelease -x lint $VERSION_PARAM --stacktrace

    - name: Upload Generated Keystore
      if: always() && env.KEYSTORE_GENERATED == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: lcb3-generated-release-keystore
        path: ${{ env.GENERATED_KEYSTORE_PATH }}
        retention-days: 1

    - name: Upload Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-official${{ env.TAG_NAME && format('-{0}', env.TAG_NAME) || '' }}
        path: |
          main-repo/app/build/outputs/bundle/**/*.aab
