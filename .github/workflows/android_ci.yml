name: Android Release Build

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build Variant (e.g., internalRelease, playstoreRelease)'
        required: true
        default: 'internalRelease'
        type: choice
        options:
        - internalRelease
        - playstoreRelease
  pull_request:
    branches: [ "master", "main", "develop" ]
  push:
    branches: [ "master", "main", "develop", "feature/*" ]

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    env:
      BUILD_VARIANT: ${{ github.event.inputs.variant || 'internalDebug' }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Internal Keystore & Google Services
      if: contains(env.BUILD_VARIANT, 'internal')
      env:
        ENCODED_STRING: ${{ secrets.INTERNAL_KEYSTORE_BASE64 }}
        GOOGLE_JSON_ENCODED: ${{ secrets.INTERNAL_GOOGLE_SERVICES_JSON_BASE64 }}
      run: |
        echo "Checking Secrets for Internal..."
        if [ -z "$ENCODED_STRING" ]; then
          echo "Warning: INTERNAL_KEYSTORE_BASE64 is empty."
        else
          mkdir -p app/src/internal
          echo "$ENCODED_STRING" | base64 -di > app/src/internal/pdfreader.jks
          echo "Decoded Internal Keystore"
        fi
        
        if [ -z "$GOOGLE_JSON_ENCODED" ]; then
          echo "Warning: INTERNAL_GOOGLE_SERVICES_JSON_BASE64 is empty."
        else
          mkdir -p app/src/internal
          echo "$GOOGLE_JSON_ENCODED" | base64 -di > app/google-services.json
          cp app/google-services.json app/src/internal/google-services.json
          echo "Decoded Internal google-services.json"
        fi

    - name: Create Internal Sign Properties
      if: contains(env.BUILD_VARIANT, 'internal')
      env:
        STORE_PASSWORD: ${{ secrets.INTERNAL_STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.INTERNAL_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.INTERNAL_KEY_PASSWORD }}
      run: |
        if [ ! -z "$STORE_PASSWORD" ]; then
          mkdir -p app/src/internal
          echo "keystore=pdfreader.jks" > app/src/internal/sign.properties
          echo "keystore.password=$STORE_PASSWORD" >> app/src/internal/sign.properties
          echo "keyAlias=$KEY_ALIAS" >> app/src/internal/sign.properties
          echo "keyPassword=$KEY_PASSWORD" >> app/src/internal/sign.properties
        fi

    - name: Decode PlayStore Keystore & Google Services
      if: contains(env.BUILD_VARIANT, 'playstore')
      env:
        ENCODED_STRING: ${{ secrets.PLAYSTORE_KEYSTORE_BASE64 }}
        GOOGLE_JSON_ENCODED: ${{ secrets.PLAYSTORE_GOOGLE_SERVICES_JSON_BASE64 }}
      run: |
        echo "Checking Secrets for PlayStore..."
        if [ -z "$ENCODED_STRING" ]; then
          echo "Error: PLAYSTORE_KEYSTORE_BASE64 is empty!"
          exit 1
        fi
        
        mkdir -p app/src/playstore
        echo "$ENCODED_STRING" | base64 -di > app/src/playstore/release.jks
        echo "Decoded PlayStore Keystore"

        if [ -n "$GOOGLE_JSON_ENCODED" ]; then
           echo "$GOOGLE_JSON_ENCODED" | base64 -di > app/google-services.json
           cp app/google-services.json app/src/playstore/google-services.json
           echo "Decoded PlayStore google-services.json"
        fi

    - name: Create PlayStore Sign Properties
      if: contains(env.BUILD_VARIANT, 'playstore')
      env:
        STORE_PASSWORD: ${{ secrets.PLAYSTORE_STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.PLAYSTORE_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.PLAYSTORE_KEY_PASSWORD }}
      run: |
        if [ ! -z "$STORE_PASSWORD" ]; then
          mkdir -p app/src/playstore
          echo "keystore=release.jks" > app/src/playstore/sign.properties
          echo "keystore.password=$STORE_PASSWORD" >> app/src/playstore/sign.properties
          echo "keyAlias=$KEY_ALIAS" >> app/src/playstore/sign.properties
          echo "keyPassword=$KEY_PASSWORD" >> app/src/playstore/sign.properties
        fi

    - name: Build with Gradle
      run: |
        echo "Building Variant: $BUILD_VARIANT"
        
        # Capitalize variant name for task construction (e.g. playstoreRelease -> PlaystoreRelease)
        CAP_VARIANT="$(tr '[:lower:]' '[:upper:]' <<< ${BUILD_VARIANT:0:1})${BUILD_VARIANT:1}"
        
        if [[ "$BUILD_VARIANT" == *"playstore"* ]]; then
            echo "Building App Bundle (AAB) for $BUILD_VARIANT"
            ./gradlew bundle$BUILD_VARIANT -x lint -x lintVital$CAP_VARIANT --stacktrace
        else
            echo "Building APK for $BUILD_VARIANT"
            ./gradlew assemble$BUILD_VARIANT -x lint -x lintVital$CAP_VARIANT --stacktrace
        fi

    - name: Upload Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-${{ env.BUILD_VARIANT }}
        path: |
          app/build/outputs/apk/**/*.apk
          app/build/outputs/bundle/**/*.aab
