name: Android Release Build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Optional versionName override'
        required: false
        type: string

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: main-repo

    env:
      # 限制 Gradle 堆内存，适配 GitHub Runner
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError"

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        path: main-repo

    - name: Set up project version fallback
      run: |
        # 从 build.gradle.kts 提取版本号
        V_NAME=$(grep "defaultVersionName =" app/build.gradle.kts | head -n 1 | awk -F'"' '{print $2}')
        echo "PROJECT_VERSION=$V_NAME" >> $GITHUB_ENV
        echo "Extracted project version: $V_NAME"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        # cache: gradle # Remove basic cache, use setup-gradle below

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: false # Allow writing to cache for all branches

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Official AAB
      env:
        REMAX_SDK_TOKEN: ${{ secrets.REMAX_SDK_TOKEN }}
      run: |
        echo "Building official release AAB"
        if [ -z "$REMAX_SDK_TOKEN" ]; then
            echo "Missing REMAX_SDK_TOKEN."
            exit 1
        fi
        
        # 1. 签名准备。Google Services JSON 已提交在 app/src/official/ 变体目录。
        echo "${{ secrets.PLAYSTORE_KEYSTORE_BASE64 }}" | base64 -di > scripts/release.jks
        GOOGLE_JSON_PATH="app/src/official/google-services.json"

        if [ ! -f "$GOOGLE_JSON_PATH" ]; then
            echo "Missing Google Services JSON: $GOOGLE_JSON_PATH"
            exit 1
        fi

        # 2. 生成签名配置文件 (sign.properties)
        echo "keystore=release.jks" > scripts/sign.properties
        echo "keystore.password=${{ secrets.PLAYSTORE_STORE_PASSWORD }}" >> scripts/sign.properties
        echo "keyAlias=${{ secrets.PLAYSTORE_KEY_ALIAS }}" >> scripts/sign.properties
        echo "keyPassword=${{ secrets.PLAYSTORE_KEY_PASSWORD }}" >> scripts/sign.properties

        # 3. 提取标签版本 (如果由标签触发)
        if [[ $GITHUB_REF == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            echo "Triggered by Tag: $TAG_NAME"
            echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
            VERSION_PARAM="-PinternalVersionName=$TAG_NAME"
            echo "VERSION_PARAM=$VERSION_PARAM" >> $GITHUB_ENV
        elif [ -n "${{ github.event.inputs.version_name }}" ]; then
            VERSION_PARAM="-PinternalVersionName=${{ github.event.inputs.version_name }}"
            echo "VERSION_PARAM=$VERSION_PARAM" >> $GITHUB_ENV
        fi

        # 4. 执行 official AAB 构建任务
        ./gradlew bundleOfficialRelease -x lint $VERSION_PARAM --stacktrace

    - name: Upload Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-official${{ env.TAG_NAME && format('-{0}', env.TAG_NAME) || '' }}
        path: |
          main-repo/app/build/outputs/bundle/**/*.aab
