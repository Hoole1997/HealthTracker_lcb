name: Build lcb4 google signed AAB

on:
  workflow_dispatch:
    inputs:
      signing_backup_public_key:
        description: 'One-time signing credential backup, encrypted to this RSA public key'
        required: false
        type: string
      version_name:
        description: 'Optional versionName override (defaults to google/config.gradle)'
        required: false
        type: string
      version_code:
        description: 'Optional versionCode override'
        required: false
        type: string
  push:
    branches: [lcb4]
    paths-ignore:
      - app/src/google/google-release.keystore

permissions:
  contents: write
  packages: read

# Queued builds read the latest branch state and reuse its newly persisted signing key.
concurrency:
  group: lcb4-google-release-signing
  cancel-in-progress: false

jobs:
  build-google-aab:
    if: ${{ inputs.signing_backup_public_key == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_SIGNING_STORE_FILE: app/src/google/google-release.keystore
      # Release credentials are required Secrets; the keystore itself is versioned on lcb4.
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      REMAX_GITHUB_USER: ${{ secrets.REMAX_GITHUB_USER || secrets.GH_PACKAGES_USER || 'toukaRemax' }}
      REMAX_GITHUB_TOKEN: ${{ secrets.REMAX_GITHUB_TOKEN || secrets.REMAX_SDK_TOKEN || secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      GRADLE_JVM_ARGS: -Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

    steps:
      - name: Require lcb4 for release signing
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" != branch || "$REF_NAME" != lcb4 ]]; then
            echo "::error::Run this workflow on lcb4; release signing keys are stored only on lcb4."
            exit 1
          fi

      - name: Checkout lcb4
        uses: actions/checkout@v4
        with:
          # Read the latest branch commit after waiting in the signing queue.
          ref: lcb4
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate signing Secrets
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_SIGNING_STORE_PASSWORD:?Missing ANDROID_SIGNING_STORE_PASSWORD Secret}"
          : "${ANDROID_SIGNING_KEY_ALIAS:?Missing ANDROID_SIGNING_KEY_ALIAS Secret}"
          : "${ANDROID_SIGNING_KEY_PASSWORD:?Missing ANDROID_SIGNING_KEY_PASSWORD Secret}"

      - name: Ensure google release keystore exists
        id: signing
        run: bash scripts/ensure_google_keystore.sh

      - name: Back up newly generated keystore
        if: always() && steps.signing.outputs.created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: google-release-keystore-${{ github.run_id }}
          path: app/src/google/google-release.keystore
          if-no-files-found: error
          retention-days: 7

      - name: Persist new project keystore on lcb4
        if: steps.signing.outputs.created == 'true'
        env:
          TARGET_BRANCH: lcb4
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$ANDROID_SIGNING_STORE_FILE"
          git commit -m 'chore: add lcb4 google release keystore [skip ci]'
          # Stop if persistence fails; the backup above allows recovery without losing the key.
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

      - name: Read committed signing key from lcb4
        shell: bash
        run: |
          set -euo pipefail
          # Always build with the certificate stored in lcb4, including the first run.
          git fetch origin lcb4
          git restore --source=refs/remotes/origin/lcb4 -- "$ANDROID_SIGNING_STORE_FILE"
          test -s "$ANDROID_SIGNING_STORE_FILE"

      - name: Build signed google release AAB
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          VERSION_ARGS=()
          [[ -z "$VERSION_NAME" ]] || VERSION_ARGS+=("-PversionName=$VERSION_NAME")
          [[ -z "$VERSION_CODE" ]] || VERSION_ARGS+=("-PversionCode=$VERSION_CODE")
          ./gradlew :app:writeGoogleReleaseMetadata :app:bundleGoogleRelease \
            "${VERSION_ARGS[@]}" \
            "-Dorg.gradle.jvmargs=$GRADLE_JVM_ARGS" \
            -Dkotlin.daemon.jvm.options=-Xmx1g \
            -x lint --max-workers=2 --no-parallel --no-configuration-cache --stacktrace

      - name: Prepare AAB artifact
        id: artifact
        run: |
          set -euo pipefail
          # Parse Gradle-generated metadata as data; never scrape Kotlin source or eval it.
          python3 - <<'PY'
          import os
          from pathlib import Path

          metadata = dict(line.split('=', 1) for line in
                          Path('app/build/outputs/release-metadata.properties').read_text().splitlines())
          bundles = list(Path('app/build/outputs/bundle/googleRelease').glob('*.aab'))
          if len(bundles) != 1:
              raise SystemExit(f'Expected one AAB, found {len(bundles)}')
          target = bundles[0].with_name(metadata['aab_name'])
          bundles[0].rename(target)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"name={metadata['aab_name']}\npath={target}\n")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Google AAB: {target.name}\n\nVersion: {metadata['version_name']} "
                            f"({metadata['version_code']})\n")
          PY

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: google-release-mapping-${{ github.run_number }}
          path: app/build/outputs/mapping/googleRelease/mapping.txt
          if-no-files-found: error
          retention-days: 30

  encrypted-signing-backup:
    if: ${{ github.ref == 'refs/heads/lcb4' && inputs.signing_backup_public_key != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Encrypt signing credentials for the repository owner
        env:
          BACKUP_PUBLIC_KEY: ${{ inputs.signing_backup_public_key }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          Path('public.pem').write_text(os.environ['BACKUP_PUBLIC_KEY'])
          credentials = {
              'storeFile': 'app/src/google/google-release.keystore',
              'storePassword': os.environ['STORE_PASSWORD'],
              'keyAlias': os.environ['KEY_ALIAS'],
              'keyPassword': os.environ['KEY_PASSWORD'],
          }
          assert all(credentials.values()), 'Missing signing credentials'
          with open('signing-credentials.enc', 'wb') as encrypted:
              subprocess.run([
                  'openssl', 'pkeyutl', '-encrypt', '-pubin', '-inkey', 'public.pem',
                  '-pkeyopt', 'rsa_padding_mode:oaep', '-pkeyopt', 'rsa_oaep_md:sha256',
              ], input=json.dumps(credentials).encode(), stdout=encrypted, check=True)
          PY
      - name: Upload encrypted signing backup
        uses: actions/upload-artifact@v4
        with:
          name: lcb4-signing-credentials-${{ github.run_id }}
          path: signing-credentials.enc
          if-no-files-found: error
          retention-days: 1
