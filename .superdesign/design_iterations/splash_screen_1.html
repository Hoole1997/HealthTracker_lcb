<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康追踪器 - 启动页</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="liquid_glass_theme.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-display);
            background: var(--background);
            color: var(--foreground);
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        /* 动态背景 */
        .animated-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg,
                #0a0a0f 0%,
                #1a1a2e 25%,
                #16213e 50%,
                #0f3460 75%,
                #533483 100%);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            z-index: -2;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 浮动液体球体 */
        .liquid-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(1px);
            opacity: 0.6;
            z-index: -1;
        }

        .orb-1 {
            width: 200px;
            height: 200px;
            top: 10%;
            left: 10%;
            background: var(--liquid-gradient-1);
            animation: float1 6s ease-in-out infinite;
        }

        .orb-2 {
            width: 150px;
            height: 150px;
            top: 60%;
            right: 15%;
            background: var(--liquid-gradient-2);
            animation: float2 8s ease-in-out infinite;
        }

        .orb-3 {
            width: 100px;
            height: 100px;
            bottom: 20%;
            left: 20%;
            background: var(--liquid-gradient-3);
            animation: float3 5s ease-in-out infinite;
        }

        .orb-4 {
            width: 120px;
            height: 120px;
            top: 30%;
            right: 40%;
            background: var(--liquid-gradient-4);
            animation: float4 7s ease-in-out infinite;
        }

        @keyframes float1 {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        @keyframes float2 {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(-180deg); }
        }

        @keyframes float3 {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(90deg); }
        }

        @keyframes float4 {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-25px) rotate(-90deg); }
        }

        /* 主容器 */
        .splash-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 2rem;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        /* Logo容器 */
        .logo-container {
            background: var(--glass-primary);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: var(--glass-shadow);
            border-radius: var(--radius-glass);
            padding: 2rem;
            margin-bottom: 2rem;
            animation: logoEntrance 1.2s var(--ease-liquid) forwards;
            transform: scale(0.8);
            opacity: 0;
        }

        @keyframes logoEntrance {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            60% {
                transform: scale(1.1);
                opacity: 0.8;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            color: var(--foreground);
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.3));
            animation: logoPulse 2s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% {
                filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.3));
            }
            50% {
                filter: drop-shadow(0 0 30px rgba(255, 255, 255, 0.6));
            }
        }

        /* 应用标题 */
        .app-title {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 3rem;
            background: linear-gradient(135deg, #ffffff 0%, #e0e7ff 50%, #c7d2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
            animation: titleGlow 1s ease-out 0.5s forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes titleGlow {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 进度条容器 */
        .progress-container {
            width: 300px;
            margin-bottom: 1rem;
            animation: progressFadeIn 0.8s ease-out 1.5s forwards;
            opacity: 0;
        }

        @keyframes progressFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--glass-secondary);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: var(--glass-blur-subtle);
            -webkit-backdrop-filter: var(--glass-blur-subtle);
            box-shadow: var(--glass-inner-shadow);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg,
                #667eea 0%,
                #764ba2 25%,
                #4facfe 50%,
                #00f2fe 75%,
                #43e97b 100%);
            background-size: 200% 100%;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(120, 119, 198, 0.5);
            animation: progressFlow 2s ease-in-out infinite,
                       progressWidth 3s ease-out forwards;
            width: 0%;
        }

        @keyframes progressFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes progressWidth {
            0% { width: 0%; }
            100% { width: 85%; }
        }

        /* 加载文字 */
        .loading-text {
            font-size: 1rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.8);
            animation: textPulse 2s ease-in-out infinite,
                       loadingFadeIn 0.6s ease-out 2s forwards;
            opacity: 0;
        }

        @keyframes loadingFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes textPulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        /* 版本信息 */
        .version-info {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.875rem;
            color: rgba(255, 255, 255, 0.6);
            animation: versionFadeIn 0.5s ease-out 2.5s forwards;
            opacity: 0;
        }

        @keyframes versionFadeIn {
            from { opacity: 0; }
            to { opacity: 0.6; }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .splash-container {
                padding: 1rem;
            }

            .app-title {
                font-size: 2rem;
                margin-bottom: 2rem;
            }

            .logo-container {
                padding: 1.5rem;
                margin-bottom: 1.5rem;
            }

            .logo-icon {
                width: 60px;
                height: 60px;
            }

            .progress-container {
                width: 250px;
            }

            .orb-1, .orb-2 {
                display: none;
            }
        }

        /* 额外的玻璃效果 */
        .glass-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 70% 80%, rgba(120, 119, 198, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
<body>
    <!-- 动态背景 -->
    <div class="animated-background"></div>

    <!-- 玻璃覆盖层 -->
    <div class="glass-overlay"></div>

    <!-- 浮动液体球体 -->
    <div class="liquid-orb orb-1"></div>
    <div class="liquid-orb orb-2"></div>
    <div class="liquid-orb orb-3"></div>
    <div class="liquid-orb orb-4"></div>

    <!-- 主容器 -->
    <div class="splash-container">
        <!-- Logo容器 -->
        <div class="logo-container">
            <i data-lucide="heart-pulse" class="logo-icon"></i>
        </div>

        <!-- 应用标题 -->
        <h1 class="app-title">健康追踪器</h1>

        <!-- 进度条 -->
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>

        <!-- 加载文字 -->
        <p class="loading-text">正在初始化健康数据...</p>

        <!-- 版本信息 -->
        <div class="version-info">版本 1.0.0</div>
    </div>

    <script>
        // 初始化 Lucide 图标
        lucide.createIcons();

        // 模拟加载进度
        let progress = 0;
        const progressFill = document.querySelector('.progress-fill');
        const loadingText = document.querySelector('.loading-text');

        const loadingMessages = [
            '正在初始化健康数据...',
            '正在加载用户配置...',
            '正在连接健康服务...',
            '准备就绪...'
        ];

        function updateProgress() {
            if (progress < 100) {
                progress += Math.random() * 5;
                if (progress > 100) progress = 100;

                progressFill.style.width = progress + '%';

                // 更新加载文字
                const messageIndex = Math.floor((progress / 100) * loadingMessages.length);
                if (messageIndex < loadingMessages.length) {
                    loadingText.textContent = loadingMessages[messageIndex];
                }

                setTimeout(updateProgress, 100 + Math.random() * 200);
            } else {
                // 加载完成后的操作
                setTimeout(() => {
                    loadingText.textContent = '启动完成!';
                    // 这里可以添加跳转到主页面的逻辑
                }, 500);
            }
        }

        // 延迟开始进度动画
        setTimeout(updateProgress, 2000);

        // 添加交互效果
        document.querySelector('.logo-container').addEventListener('mouseover', function() {
            this.style.transform = 'scale(1.05)';
            this.style.boxShadow = '0 12px 48px rgba(31, 38, 135, 0.5)';
        });

        document.querySelector('.logo-container').addEventListener('mouseout', function() {
            this.style.transform = 'scale(1)';
            this.style.boxShadow = '0 8px 32px rgba(31, 38, 135, 0.37)';
        });
    </script>
</body>
</html>
