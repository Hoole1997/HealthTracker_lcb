<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康追踪器 - 专业版首页</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="medical_health_theme.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-medical);
            background: var(--background);
            color: var(--foreground);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 主容器 */
        .app-container {
            min-height: 100vh;
            background: var(--animated-gradient);
            animation: gradientFlow 12s ease infinite;
        }

        /* 头部 */
        .header {
            background: var(--glass-medical);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            padding: var(--spacing-lg) var(--spacing-xl);
            position: sticky;
            top: 0;
            z-index: 100;
            animation: slideDown 0.6s var(--ease-medical);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .app-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--medical-primary);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .header-actions {
            display: flex;
            gap: var(--spacing-sm);
        }

        .header-button {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: var(--spacing-sm);
            border-radius: var(--radius-sm);
            transition: all var(--duration-normal) var(--ease-medical);
        }

        .header-button:hover {
            background: var(--glass-overlay);
            color: var(--medical-primary);
        }

        /* 主内容区 */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-xl);
            display: grid;
            gap: var(--spacing-xl);
        }

        /* 健康状态概览 */
        .health-overview {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-lg);
            animation: fadeInUp 0.8s var(--ease-medical) 0.2s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status-card {
            padding: var(--spacing-xl);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .status-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--medical-primary);
            transform: scaleX(0);
            transform-origin: left;
            animation: progressBar 1.5s var(--ease-medical) 0.5s forwards;
        }

        @keyframes progressBar {
            to {
                transform: scaleX(1);
            }
        }

        .status-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto var(--spacing-md);
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--medical-primary);
            color: white;
            font-size: 1.5rem;
        }

        .status-title {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: var(--spacing-xs);
            color: var(--text-primary);
        }

        .status-value {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        /* 实时数据仪表盘 */
        .data-dashboard {
            background: var(--glass-medical);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: var(--spacing-3xl);
            box-shadow: var(--shadow-floating);
            animation: fadeInUp 0.8s var(--ease-medical) 0.4s both;
        }

        .dashboard-title {
            text-align: center;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--spacing-3xl);
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-4xl);
        }

        .metric-card {
            text-align: center;
            position: relative;
        }

        .metric-circle {
            width: 120px;
            height: 120px;
            margin: 0 auto var(--spacing-lg);
            position: relative;
            border-radius: var(--radius-full);
            background: conic-gradient(from 0deg, var(--medical-primary) 0%, var(--medical-primary) 70%, var(--surface) 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: rotateIn 1.2s var(--ease-chart) 0.8s both;
        }

        @keyframes rotateIn {
            from {
                transform: rotate(-180deg) scale(0.8);
                opacity: 0;
            }
            to {
                transform: rotate(0deg) scale(1);
                opacity: 1;
            }
        }

        .metric-circle::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80%;
            background: var(--card-background);
            border-radius: var(--radius-full);
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .metric-content {
            position: relative;
            z-index: 1;
        }

        .metric-value {
            font-family: var(--font-data);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--medical-primary);
            margin-bottom: var(--spacing-xs);
            animation: countUp var(--duration-chart) var(--ease-medical) 1s both;
        }

        @keyframes countUp {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .metric-unit {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .metric-label {
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .glucose-circle {
            background: conic-gradient(from 0deg, #667eea 0%, #667eea 75%, var(--surface) 75%);
        }

        .pressure-circle {
            background: conic-gradient(from 0deg, #f093fb 0%, #f5576c 65%, var(--surface) 65%);
        }

        /* 快速操作面板 */
        .quick-actions {
            animation: fadeInUp 0.8s var(--ease-medical) 0.6s both;
        }

        .actions-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--spacing-lg);
            text-align: center;
        }

        .actions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: var(--spacing-lg);
        }

        .action-card {
            background: var(--glass-medical);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            text-align: center;
            cursor: pointer;
            transition: all var(--duration-normal) var(--ease-medical);
            box-shadow: var(--shadow-card);
        }

        .action-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-floating);
            border-color: var(--medical-primary);
        }

        .action-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto var(--spacing-md);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--medical-primary);
            color: white;
            font-size: 1.5rem;
            transition: all var(--duration-normal) var(--ease-medical);
        }

        .action-card:hover .action-icon {
            transform: scale(1.1);
            box-shadow: var(--shadow-glow);
        }

        .action-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--spacing-xs);
        }

        .action-description {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        /* 健康洞察 */
        .health-insights {
            animation: fadeInUp 0.8s var(--ease-medical) 0.8s both;
        }

        .insights-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--spacing-lg);
            text-align: center;
        }

        .insight-item {
            background: var(--glass-medical);
            border: 1px solid var(--glass-border);
            border-left: 4px solid var(--medical-primary);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-md);
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            transition: all var(--duration-normal) var(--ease-medical);
        }

        .insight-item:hover {
            transform: translateX(4px);
            box-shadow: var(--shadow-elevated);
        }

        .insight-item.success {
            border-left-color: var(--health-good);
        }

        .insight-item.warning {
            border-left-color: var(--health-attention);
        }

        .insight-item.info {
            border-left-color: var(--medical-primary);
        }

        .insight-icon {
            font-size: 1.25rem;
            color: var(--medical-primary);
        }

        .insight-text {
            flex: 1;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .main-content {
                padding: var(--spacing-lg);
                gap: var(--spacing-lg);
            }

            .health-overview {
                grid-template-columns: 1fr;
            }

            .metrics-grid {
                grid-template-columns: 1fr;
                gap: var(--spacing-3xl);
            }

            .metric-circle {
                width: 100px;
                height: 100px;
            }

            .metric-value {
                font-size: 1.25rem;
            }

            .actions-grid {
                grid-template-columns: 1fr;
            }

            .header-content {
                padding: 0 var(--spacing-lg);
            }

            .app-title {
                font-size: 1.25rem;
            }
        }

        @media (max-width: 480px) {
            .data-dashboard {
                padding: var(--spacing-xl);
            }

            .metric-circle {
                width: 80px;
                height: 80px;
            }

            .metric-value {
                font-size: 1rem;
            }

            .action-icon {
                width: 48px;
                height: 48px;
                font-size: 1.25rem;
            }
        }

        /* 加载动画 */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--glass-border);
            border-radius: var(--radius-full);
            border-top-color: var(--medical-primary);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* 数值动画 */
        .animate-value {
            animation: valueUpdate 0.6s var(--ease-medical);
        }

        @keyframes valueUpdate {
            0% {
                transform: scale(1.2);
                color: var(--medical-primary);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 头部 -->
        <header class="header">
            <div class="header-content">
                <h1 class="app-title">
                    <i data-lucide="heart-pulse"></i>
                    健康追踪器
                </h1>
                <div class="header-actions">
                    <button class="header-button" title="设置">
                        <i data-lucide="settings"></i>
                    </button>
                    <button class="header-button" title="通知">
                        <i data-lucide="bell"></i>
                    </button>
                    <button class="header-button" title="用户">
                        <i data-lucide="user"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- 主内容 -->
        <main class="main-content">
            <!-- 健康状态概览 -->
            <section class="health-overview">
                <div class="status-card medical-card">
                    <div class="status-icon">
                        <i data-lucide="droplets"></i>
                    </div>
                    <h3 class="status-title">血糖状态</h3>
                    <div class="health-status good">良好</div>
                </div>

                <div class="status-card medical-card">
                    <div class="status-icon">
                        <i data-lucide="activity"></i>
                    </div>
                    <h3 class="status-title">血压状态</h3>
                    <div class="health-status excellent">正常</div>
                </div>
            </section>

            <!-- 实时数据仪表盘 -->
            <section class="data-dashboard">
                <h2 class="dashboard-title">实时健康数据</h2>
                <div class="metrics-grid">
                    <!-- 血糖数据 -->
                    <div class="metric-card">
                        <div class="metric-circle glucose-circle">
                            <div class="metric-content">
                                <div class="metric-value" id="glucoseValue">95.2</div>
                                <div class="metric-unit">mg/dL</div>
                            </div>
                        </div>
                        <div class="metric-label">血糖值</div>
                        <div class="data-label">2分钟前</div>
                    </div>

                    <!-- 血压数据 -->
                    <div class="metric-card">
                        <div class="metric-circle pressure-circle">
                            <div class="metric-content">
                                <div class="metric-value" id="pressureValue">120/80</div>
                                <div class="metric-unit">mmHg</div>
                            </div>
                        </div>
                        <div class="metric-label">血压值</div>
                        <div class="data-label">5分钟前</div>
                    </div>
                </div>
            </section>

            <!-- 快速操作面板 -->
            <section class="quick-actions">
                <h2 class="actions-title">快速操作</h2>
                <div class="actions-grid">
                    <div class="action-card" onclick="recordGlucose()">
                        <div class="action-icon">
                            <i data-lucide="plus-circle"></i>
                        </div>
                        <h3 class="action-title">记录血糖</h3>
                        <p class="action-description">快速记录当前血糖值</p>
                    </div>

                    <div class="action-card" onclick="recordPressure()">
                        <div class="action-icon">
                            <i data-lucide="heart"></i>
                        </div>
                        <h3 class="action-title">记录血压</h3>
                        <p class="action-description">测量并记录血压数据</p>
                    </div>

                    <div class="action-card" onclick="medicationReminder()">
                        <div class="action-icon">
                            <i data-lucide="pill"></i>
                        </div>
                        <h3 class="action-title">用药提醒</h3>
                        <p class="action-description">管理药物提醒计划</p>
                    </div>

                    <div class="action-card" onclick="viewTrends()">
                        <div class="action-icon">
                            <i data-lucide="trending-up"></i>
                        </div>
                        <h3 class="action-title">查看趋势</h3>
                        <p class="action-description">分析健康数据趋势</p>
                    </div>
                </div>
            </section>

            <!-- 健康洞察和建议 -->
            <section class="health-insights">
                <h2 class="insights-title">健康洞察</h2>

                <div class="insight-item success">
                    <i class="insight-icon" data-lucide="check-circle"></i>
                    <span class="insight-text">今日血糖控制良好，继续保持健康饮食习惯</span>
                </div>

                <div class="insight-item warning">
                    <i class="insight-icon" data-lucide="alert-triangle"></i>
                    <span class="insight-text">建议记录餐后2小时血糖，帮助更好地监控血糖变化</span>
                </div>

                <div class="insight-item info">
                    <i class="insight-icon" data-lucide="target"></i>
                    <span class="insight-text">本周已达成血糖监测目标，坚持规律监测有助于健康管理</span>
                </div>
            </section>
        </main>
    </div>

    <script>
        // 初始化图标
        lucide.createIcons();

        // 模拟实时数据更新
        function updateHealthData() {
            const glucoseValue = document.getElementById('glucoseValue');
            const pressureValue = document.getElementById('pressureValue');

            // 模拟血糖值变化 (90-110 mg/dL)
            const newGlucose = (90 + Math.random() * 20).toFixed(1);
            glucoseValue.textContent = newGlucose;
            glucoseValue.classList.add('animate-value');
            setTimeout(() => glucoseValue.classList.remove('animate-value'), 600);

            // 模拟血压值变化
            const systolic = Math.floor(110 + Math.random() * 20);
            const diastolic = Math.floor(70 + Math.random() * 15);
            pressureValue.textContent = `${systolic}/${diastolic}`;
            pressureValue.classList.add('animate-value');
            setTimeout(() => pressureValue.classList.remove('animate-value'), 600);
        }

        // 数值计数动画
        function animateValue(element, start, end, duration) {
            const startTime = performance.now();

            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);

                const current = start + (end - start) * easeOutCubic(progress);
                element.textContent = current.toFixed(1);

                if (progress < 1) {
                    requestAnimationFrame(update);
                }
            }

            requestAnimationFrame(update);
        }

        function easeOutCubic(t) {
            return 1 - Math.pow(1 - t, 3);
        }

        // 快速操作函数
        function recordGlucose() {
            showNotification('正在打开血糖记录页面...', 'info');
            // 这里可以跳转到血糖记录页面
        }

        function recordPressure() {
            showNotification('正在打开血压记录页面...', 'info');
            // 这里可以跳转到血压记录页面
        }

        function medicationReminder() {
            showNotification('正在打开用药提醒设置...', 'info');
            // 这里可以跳转到用药提醒页面
        }

        function viewTrends() {
            showNotification('正在打开趋势分析页面...', 'info');
            // 这里可以跳转到趋势分析页面
        }

        // 通知提示
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: var(--glass-medical);
                border: 1px solid var(--glass-border);
                border-radius: var(--radius-md);
                padding: var(--spacing-md) var(--spacing-lg);
                box-shadow: var(--shadow-floating);
                backdrop-filter: blur(16px);
                z-index: 1000;
                animation: slideInRight 0.3s var(--ease-medical);
                max-width: 300px;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.animation = 'slideOutRight 0.3s var(--ease-medical)';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        // 页面加载完成后的初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化数值动画
            const glucoseElement = document.getElementById('glucoseValue');
            const pressureElement = document.getElementById('pressureValue');

            setTimeout(() => {
                animateValue(glucoseElement, 0, 95.2, 1200);
            }, 1000);

            // 每30秒更新一次数据（模拟实时更新）
            setInterval(updateHealthData, 30000);

            // 添加CSS动画样式
            const style = document.createElement('style');
            style.textContent = `
                @keyframes slideInRight {
                    from {
                        transform: translateX(100%);
                        opacity: 0;
                    }
                    to {
                        transform: translateX(0);
                        opacity: 1;
                    }
                }

                @keyframes slideOutRight {
                    from {
                        transform: translateX(0);
                        opacity: 1;
                    }
                    to {
                        transform: translateX(100%);
                        opacity: 0;
                    }
                }
            `;
            document.head.appendChild(style);
        });

        // 添加键盘快捷键支持
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey || e.metaKey) {
                switch(e.key) {
                    case '1':
                        e.preventDefault();
                        recordGlucose();
                        break;
                    case '2':
                        e.preventDefault();
                        recordPressure();
                        break;
                    case '3':
                        e.preventDefault();
                        medicationReminder();
                        break;
                    case '4':
                        e.preventDefault();
                        viewTrends();
                        break;
                }
            }
        });
    </script>
</body>
</html>
