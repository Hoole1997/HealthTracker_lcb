<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康追踪器 - 深色版</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="dark_health_theme.css">
    <style>
        /* 额外的组件样式 */
        .app-container {
            min-height: 100vh;
            background: var(--background);
            padding-bottom: 80px; /* 为底部导航留空间 */
        }

        /* 状态栏 */
        .status-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            animation: slideDown 0.3s var(--ease-out);
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100%);
            }
            to {
                transform: translateY(0);
            }
        }

        .battery {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .battery-icon {
            width: 24px;
            height: 12px;
            border: 1px solid var(--text-primary);
            border-radius: 2px;
            position: relative;
        }

        .battery-icon::after {
            content: '';
            position: absolute;
            right: -3px;
            top: 3px;
            width: 2px;
            height: 6px;
            background: var(--text-primary);
            border-radius: 0 1px 1px 0;
        }

        .battery-fill {
            height: 100%;
            background: var(--text-primary);
            border-radius: 1px;
            width: 85%;
            transition: width 0.3s var(--ease);
        }

        /* 主内容区 */
        .main-content {
            padding: var(--spacing-lg);
        }

        /* 卡片进场动画 */
        .health-card {
            opacity: 0;
            transform: translateY(20px);
            animation: cardSlideUp 0.4s var(--ease-out) forwards;
        }

        .health-card:nth-child(1) { animation-delay: 0.1s; }
        .health-card:nth-child(2) { animation-delay: 0.2s; }
        .health-card:nth-child(3) { animation-delay: 0.3s; }
        .health-card:nth-child(4) { animation-delay: 0.4s; }

        @keyframes cardSlideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 仪表盘增强样式 */
        .gauge-container {
            align-items: flex-start;
        }

        .gauge {
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .gauge-fill {
            transition: background 1.2s var(--ease-out);
        }

        .gauge-center {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60%;
            height: 60%;
            background: var(--card-background);
            border-radius: var(--radius-full);
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .gauge-pointer {
            position: absolute;
            top: 15%;
            left: 50%;
            width: 2px;
            height: 30%;
            background: white;
            border-radius: 1px;
            transform-origin: bottom center;
            transform: translateX(-50%);
            z-index: 3;
            transition: transform 1s var(--ease-out);
        }

        /* 数据显示增强 */
        .data-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .data-value {
            line-height: 1.2;
            margin-bottom: var(--spacing-xs);
        }

        .data-unit {
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: var(--font-weight-normal);
        }

        .data-status {
            margin-bottom: var(--spacing-lg);
        }

        /* 血糖特殊样式 */
        .blood-sugar .data-value {
            color: var(--blood-sugar-primary);
        }

        /* 血压特殊样式 */
        .blood-pressure .data-value {
            color: var(--blood-pressure-primary);
        }

        /* 用药提醒样式 */
        .medication-card {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-lg);
        }

        .reminder-info {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }

        .reminder-emoji {
            font-size: 1.5rem;
        }

        .reminder-text {
            flex: 1;
        }

        .reminder-time {
            font-weight: var(--font-weight-semibold);
            color: var(--text-primary);
            margin-bottom: var(--spacing-xs);
        }

        .reminder-desc {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        /* 按钮位置调整 */
        .button-container {
            display: flex;
            justify-content: flex-end;
            margin-top: var(--spacing-md);
        }

        /* 底部导航增强 */
        .bottom-nav {
            animation: slideUp 0.4s var(--ease-out) 0.6s both;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* 数值动画 */
        .animate-number {
            animation: numberPop 0.6s var(--ease-out);
        }

        @keyframes numberPop {
            0% {
                transform: scale(1.2);
                opacity: 0.8;
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* 触觉反馈 */
        .health-card:active {
            transform: translateY(-1px) scale(0.995);
        }

        .action-button:active {
            transform: translateY(0) scale(0.95);
        }

        /* 加载状态 */
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--gauge-track);
            border-top: 2px solid var(--text-primary);
            border-radius: var(--radius-full);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 响应式优化 */
        @media (max-width: 480px) {
            .main-content {
                padding: var(--spacing-md);
            }

            .status-bar {
                padding: var(--spacing-xs) var(--spacing-md);
                font-size: 0.8rem;
            }

            .data-value {
                font-size: 1.25rem;
            }

            .module-title {
                font-size: 1rem;
            }

            .gauge {
                width: 60px;
                height: 60px;
            }
        }

        /* 脉冲动画用于重要提醒 */
        .pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 状态栏 -->
        <div class="status-bar">
            <div class="status-left">
                <span>10:55</span>
                <i data-lucide="bell" style="font-size: 0.75rem;"></i>
                <i data-lucide="heart" style="font-size: 0.75rem;"></i>
                <i data-lucide="user" style="font-size: 0.75rem;"></i>
                <span>•</span>
            </div>
            <div class="status-right">
                <i data-lucide="key" style="font-size: 0.75rem;"></i>
                <i data-lucide="wifi" style="font-size: 0.75rem;"></i>
                <div style="display: flex; gap: 1px;">
                    <div style="width: 3px; height: 8px; background: var(--text-primary); border-radius: 1px;"></div>
                    <div style="width: 3px; height: 10px; background: var(--text-primary); border-radius: 1px;"></div>
                    <div style="width: 3px; height: 12px; background: var(--text-primary); border-radius: 1px;"></div>
                </div>
                <div class="battery">
                    <div class="battery-icon">
                        <div class="battery-fill"></div>
                    </div>
                    <span>85</span>
                </div>
            </div>
        </div>

        <!-- 主内容 -->
        <div class="main-content">
            <!-- 血糖模块 -->
            <div class="health-card blood-sugar">
                <div class="module-header">
                    <div class="module-title">
                        <div class="module-icon">
                            <i data-lucide="droplets"></i>
                        </div>
                        <span>Blood Sugar</span>
                    </div>
                    <i class="module-arrow" data-lucide="chevron-right"></i>
                </div>

                <div class="gauge-container">
                    <div class="gauge">
                        <div class="gauge-fill" style="--gauge-percentage: 75%;"></div>
                        <div class="gauge-center"></div>
                        <div class="gauge-pointer" style="transform: translateX(-50%) rotate(135deg);"></div>
                    </div>
                    <div class="data-content">
                        <div class="data-value" id="bloodSugarValue">95.2 <span class="data-unit">mg/dL</span></div>
                        <div class="data-status has-data">2分钟前</div>
                        <div class="button-container">
                            <button class="action-button" onclick="recordBloodSugar()">Record</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 心率模块 -->
            <div class="health-card heart-rate">
                <div class="module-header">
                    <div class="module-title">
                        <div class="module-icon">
                            <i data-lucide="heart"></i>
                        </div>
                        <span>Heart rate</span>
                    </div>
                    <i class="module-arrow" data-lucide="chevron-right"></i>
                </div>

                <div class="gauge-container">
                    <div class="gauge">
                        <div class="gauge-fill" style="--gauge-percentage: 0%;"></div>
                        <div class="gauge-center"></div>
                        <div class="gauge-pointer" style="transform: translateX(-50%) rotate(0deg);"></div>
                    </div>
                    <div class="data-content">
                        <div class="data-status">No data today</div>
                        <div class="button-container">
                            <button class="action-button" onclick="measureHeartRate()">Measure</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 血压模块 -->
            <div class="health-card blood-pressure">
                <div class="module-header">
                    <div class="module-title">
                        <div class="module-icon">
                            <i data-lucide="activity"></i>
                        </div>
                        <span>Blood pressure</span>
                    </div>
                    <i class="module-arrow" data-lucide="chevron-right"></i>
                </div>

                <div class="gauge-container">
                    <div class="gauge">
                        <div class="gauge-fill" style="--gauge-percentage: 65%;"></div>
                        <div class="gauge-center"></div>
                        <div class="gauge-pointer" style="transform: translateX(-50%) rotate(117deg);"></div>
                    </div>
                    <div class="data-content">
                        <div class="data-value" id="bloodPressureValue">120/80 <span class="data-unit">mmHg</span></div>
                        <div class="data-status has-data">5分钟前</div>
                        <div class="button-container">
                            <button class="action-button" onclick="recordBloodPressure()">Record</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 用药提醒模块 -->
            <div class="health-card medication">
                <div class="module-header">
                    <div class="module-title">
                        <div class="module-icon">
                            <i data-lucide="pill"></i>
                        </div>
                        <span>Medication</span>
                    </div>
                    <i class="module-arrow" data-lucide="chevron-right"></i>
                </div>

                <div class="medication-card">
                    <div class="reminder-info">
                        <span class="reminder-emoji">💪</span>
                        <div class="reminder-text">
                            <div class="reminder-time">下次提醒：2小时后</div>
                            <div class="reminder-desc">按处方服用1片</div>
                        </div>
                    </div>
                    <div class="button-container">
                        <button class="action-button" onclick="manageMedication()">Manage</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部导航 -->
        <div class="bottom-nav">
            <button class="nav-button active">
                <i data-lucide="home"></i>
            </button>
            <button class="nav-button">
                <i data-lucide="settings"></i>
            </button>
        </div>
    </div>

    <script>
        // 初始化图标
        lucide.createIcons();

        // 模拟数据更新
        function updateHealthData() {
            // 血糖值更新
            const bloodSugarElement = document.getElementById('bloodSugarValue');
            const newBloodSugar = (85 + Math.random() * 30).toFixed(1);

            if (bloodSugarElement) {
                bloodSugarElement.innerHTML = `${newBloodSugar} <span class="data-unit">mg/dL</span>`;
                bloodSugarElement.classList.add('animate-number');
                setTimeout(() => bloodSugarElement.classList.remove('animate-number'), 600);
            }

            // 血压值更新
            const bloodPressureElement = document.getElementById('bloodPressureValue');
            const systolic = Math.floor(110 + Math.random() * 20);
            const diastolic = Math.floor(70 + Math.random() * 15);

            if (bloodPressureElement) {
                bloodPressureElement.innerHTML = `${systolic}/${diastolic} <span class="data-unit">mmHg</span>`;
                bloodPressureElement.classList.add('animate-number');
                setTimeout(() => bloodPressureElement.classList.remove('animate-number'), 600);
            }
        }

        // 仪表盘动画初始化
        function initializeGauges() {
            const gauges = document.querySelectorAll('.gauge-fill');
            gauges.forEach((gauge, index) => {
                const percentage = gauge.style.getPropertyValue('--gauge-percentage');
                if (percentage && percentage !== '0%') {
                    setTimeout(() => {
                        const gaugeElement = gauge.parentElement;
                        const pointer = gaugeElement.querySelector('.gauge-pointer');
                        const percentValue = parseFloat(percentage);
                        const rotation = (percentValue / 100) * 180; // 半圆角度

                        if (pointer) {
                            pointer.style.transform = `translateX(-50%) rotate(${rotation}deg)`;
                        }
                    }, 500 + index * 200);
                }
            });
        }

        // 操作函数
        function recordBloodSugar() {
            showNotification('正在打开血糖记录...', 'info');
            // 模拟加载状态
            const button = event.target;
            const originalText = button.textContent;
            button.innerHTML = '<span class="loading-spinner"></span>';
            setTimeout(() => {
                button.textContent = originalText;
            }, 1500);
        }

        function measureHeartRate() {
            showNotification('正在启动心率测量...', 'info');
            // 模拟测量过程
            const button = event.target;
            button.innerHTML = '<span class="loading-spinner"></span>';

            setTimeout(() => {
                const heartRateCard = button.closest('.heart-rate');
                const dataContent = heartRateCard.querySelector('.data-content');
                dataContent.innerHTML = `
                    <div class="data-value" style="color: var(--heart-rate-primary);">78 <span class="data-unit">bpm</span></div>
                    <div class="data-status has-data">刚刚</div>
                    <div class="button-container">
                        <button class="action-button" onclick="measureHeartRate()">Measure</button>
                    </div>
                `;

                // 更新仪表盘
                const gaugeFill = heartRateCard.querySelector('.gauge-fill');
                const pointer = heartRateCard.querySelector('.gauge-pointer');
                gaugeFill.style.setProperty('--gauge-percentage', '60%');
                pointer.style.transform = 'translateX(-50%) rotate(108deg)';

                showNotification('心率测量完成', 'success');
            }, 3000);
        }

        function recordBloodPressure() {
            showNotification('正在打开血压记录...', 'info');
        }

        function manageMedication() {
            showNotification('正在打开用药管理...', 'info');
        }

        // 通知系统
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            const colors = {
                info: 'var(--status-info)',
                success: 'var(--status-success)',
                warning: 'var(--status-warning)',
                error: 'var(--status-error)'
            };

            notification.style.cssText = `
                position: fixed;
                top: 60px;
                left: 50%;
                transform: translateX(-50%);
                background: var(--card-background);
                color: var(--text-primary);
                border: 1px solid ${colors[type]};
                border-radius: var(--radius-md);
                padding: var(--spacing-md) var(--spacing-lg);
                box-shadow: var(--card-shadow-hover);
                z-index: 1000;
                font-size: 0.875rem;
                animation: notificationSlide 0.3s var(--ease-out);
                max-width: 300px;
                text-align: center;
            `;

            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.animation = 'notificationSlide 0.3s var(--ease-out) reverse';
                setTimeout(() => notification.remove(), 300);
            }, 2500);
        }

        // 添加通知动画
        const notificationStyle = document.createElement('style');
        notificationStyle.textContent = `
            @keyframes notificationSlide {
                from {
                    transform: translateX(-50%) translateY(-20px);
                    opacity: 0;
                }
                to {
                    transform: translateX(-50%) translateY(0);
                    opacity: 1;
                }
            }
        `;
        document.head.appendChild(notificationStyle);

        // 底部导航切换
        document.querySelectorAll('.nav-button').forEach(button => {
            button.addEventListener('click', function() {
                document.querySelectorAll('.nav-button').forEach(btn => btn.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // 页面初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化仪表盘动画
            setTimeout(initializeGauges, 800);

            // 每30秒更新一次数据
            setInterval(updateHealthData, 30000);

            // 添加触觉反馈（如果支持）
            if ('vibrate' in navigator) {
                document.querySelectorAll('.action-button').forEach(button => {
                    button.addEventListener('click', () => {
                        navigator.vibrate(50);
                    });
                });
            }
        });

        // 键盘快捷键
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey || e.metaKey) {
                switch(e.key) {
                    case '1':
                        e.preventDefault();
                        recordBloodSugar();
                        break;
                    case '2':
                        e.preventDefault();
                        measureHeartRate();
                        break;
                    case '3':
                        e.preventDefault();
                        recordBloodPressure();
                        break;
                    case '4':
                        e.preventDefault();
                        manageMedication();
                        break;
                }
            }
        });

        // PWA支持（如果需要）
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                // 这里可以注册service worker
                console.log('PWA ready');
            });
        }
    </script>
</body>
</html>
